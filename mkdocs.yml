site_name: Financial Machine Learning
site_description: Documentation for the financial research and trading project.
site_url: https://kwonjunhyuk9.github.io/financial-machine-learning/
repo_name: financial-machine-learning
repo_url: https://example.com/financial-machine-learning

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Requirements: requirements.md
  - Architecture: architecture.md
  - Decisions: decisions.md
  - Style Guide: styles.md
  - API:
      - Data Preprocessing:
          - Alternative Data: api/data_preprocessing/alternative_data.md
          - Alternative Sentiment Scores: api/data_preprocessing/alternative_sentiment_scores.md
          - Fundamental Data: api/data_preprocessing/fundamental_data.md
          - Fundamental Ratios: api/data_preprocessing/fundamental_ratios.md
          - Market Data: api/data_preprocessing/market_data.md
          - Market Structured Bars: api/data_preprocessing/market_structured_bars.md
          - Market Differentiated Bars: api/data_preprocessing/market_differentiated_bars.md
          - Market Technical Indicators: api/data_preprocessing/market_technical_indicators.md
          - Event Labeling: api/data_preprocessing/event_labeling.md
          - Event Weights: api/data_preprocessing/event_weights.md
      - Strategy Modeling:
          - Cross Validation: api/strategy_modeling/cross_validation.md
          - Ensemble Methods: api/strategy_modeling/ensemble_methods.md
          - Feature Importance: api/strategy_modeling/feature_importance.md
          - Hyperparameter Tuning: api/strategy_modeling/hyperparameter_tuning.md
      - Model Backtesting:
          - Backtest Overfitting: api/model_backtesting/backtest_overfitting.md
          - Backtest Synthetic: api/model_backtesting/backtest_synthetic.md
          - Backtest Validation: api/model_backtesting/backtest_validation.md
          - Bet Sizing: api/model_backtesting/bet_sizing.md
          - Backtest Statistics: api/model_backtesting/backtest_statistics.md
          - Strategy Risk: api/model_backtesting/strategy_risk.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - .
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
        - docs
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra:
  generator: false
