site_name: Financial Machine Learning
site_description: Documentation for the financial research and trading project.
site_url: https://kwonjunhyuk9.github.io/financial-machine-learning/
repo_name: financial-machine-learning
repo_url: https://example.com/financial-machine-learning

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Requirements: requirements.md
  - Architecture: architecture.md
  - Decisions: decisions.md
  - Style Guide: styles.md
  - API:
      - Preprocessing:
          - Alternative Data: api/preprocessing/alternative_data.md
          - Alternative Sentiment Scores: api/preprocessing/alternative_sentiment_scores.md
          - Market Data: api/preprocessing/market_data.md
          - Market Structured Bars: api/preprocessing/market_structured_bars.md
          - Market Differentiated Bars: api/preprocessing/market_differentiated_bars.md
          - Market Technical Indicators: api/preprocessing/market_technical_indicators.md
          - Train Test Split: api/preprocessing/train_test_split.md
          - Event Labeling: api/preprocessing/event_labeling.md
          - Event Weights: api/preprocessing/event_weights.md
          - Prepare the Data: api/preprocessing/prepare_the_data.md
      - Modeling:
          - Purged Validation: api/modeling/purged_validation.md
          - Ensemble Methods: api/modeling/ensemble_methods.md
          - Feature Importance: api/modeling/feature_importance.md
          - Hyperparameter Tuning: api/modeling/hyperparameter_tuning.md
          - Model Workflow: api/modeling/model_workflow.md
      - Backtesting:
          - Backtest Synthetic: api/backtesting/backtest_synthetic.md
          - Strategy Validation: api/backtesting/strategy_validation.md
          - Bet Sizing: api/backtesting/bet_sizing.md
          - Portfolio Accounting: api/backtesting/portfolio.md
          - Backtest Statistics: api/backtesting/backtest_statistics.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - .
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
        - docs
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra:
  generator: false
