[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-machine-learning"
version = "0.0.0"
description = "Research utilities for financial machine learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
      "alpaca-py",
      "financetoolkit==2.1.4",
      "loguru",
      "matplotlib",
      "numpy",
      "pandas",
      "pyarrow",
      "python-dotenv",
      "scikit-learn",
      "scipy",
      "statsmodels",
      "torch",
      "tqdm",
      "transformers",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
